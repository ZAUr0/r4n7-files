<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сервисы</title>
<link rel="stylesheet" href="services.css">
<!--
  zStore Сервисы — UI как zStore / Библиотека.
  Цвета поиска/контейнера подставляет приложение (ServicesFeedTheme).
-->
</head>
<body class="feed">
  <main class="page">
    <header class="page-header">
      <h1>Сервисы</h1>
      <span class="subtitle">Нужные для вашего айфон сервисы</span>
    </header>

    <div class="search-wrap">
      <label class="search" id="searchBox">
        <span class="glyph" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.25" stroke="currentColor" stroke-width="2.4"/>
            <path d="M16.2 16.2L20.5 20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <input id="search" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Поиск сервисов" aria-label="Поиск сервисов">
        <button type="button" class="clear" id="clearSearch" aria-label="Очистить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm3.3 12.6a1 1 0 0 1-1.4 1.4L12 13.4l-1.9 1.9a1 1 0 0 1-1.4-1.4l1.9-1.9-1.9-1.9a1 1 0 0 1 1.4-1.4l1.9 1.9 1.9-1.9a1 1 0 0 1 1.4 1.4L13.4 12z"/>
          </svg>
        </button>
      </label>
    </div>

    <div class="chips" id="chips" role="tablist" aria-label="Категории">
      <button type="button" class="chip selected" data-filter="all" role="tab" aria-selected="true">Все<span class="badge" data-count="0"></span></button>
      <button type="button" class="chip" data-filter="vpn" role="tab" aria-selected="false">VPN<span class="badge" data-count="0"></span></button>
      <button type="button" class="chip" data-filter="ai" role="tab" aria-selected="false">ИИ<span class="badge" data-count="0"></span></button>
      <button type="button" class="chip" data-filter="apple" role="tab" aria-selected="false">Apple<span class="badge" data-count="0"></span></button>
    </div>

    <section class="list-shell" id="list">
      <a class="row"
         href="s/vaynah-vpn.html"
         data-id="vaynah-vpn"
         data-category="vpn"
         data-search="вайнах vpn vpn zaur dadaev быстрый стабильный telegram">
        <img class="icon" src="icons/VPNIcon.png" alt="" width="116" height="116" decoding="async">
        <div class="copy">
          <strong>Вайнах VPN</strong>
          <span>VPN</span>
          <span>от 200 ₽/мес.</span>
        </div>
        <span class="pay">ОПЛАТИТЬ</span>
      </a>

      <div class="empty" id="empty">
        <strong>Нет Сервисов</strong>
        <p>Скоро появится сервисы</p>
      </div>
      <div class="no-results" id="noResults">
        <strong>Ничего не найдено</strong>
        <p>Попробуйте другой запрос или фильтр</p>
      </div>
    </section>
  </main>

  <script>
  window.zstoreFitFeed = function () {
    var h = window.innerHeight || document.documentElement.clientHeight;
    document.documentElement.style.height = h + 'px';
    document.body.style.height = h + 'px';
    var page = document.querySelector('body.feed .page');
    if (page) page.style.height = h + 'px';
  };
  window.addEventListener('load', window.zstoreFitFeed);
  window.addEventListener('resize', window.zstoreFitFeed);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', window.zstoreFitFeed);
  }
  window.zstoreFitFeed();

  (function () {
    var search = document.getElementById('search');
    var searchBox = document.getElementById('searchBox');
    var clearBtn = document.getElementById('clearSearch');
    var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
    var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
    var empty = document.getElementById('empty');
    var noResults = document.getElementById('noResults');
    var filter = 'all';

    function normalize(s) {
      return (s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function matchesCategory(row, id) {
      if (id === 'all') return true;
      var cat = (row.getAttribute('data-category') || '').toLowerCase();
      if (id === 'vpn') return cat.indexOf('vpn') !== -1;
      if (id === 'ai') return /ии|ai|chatgpt|gpt/.test(cat) || /ии|ai|chatgpt|gpt/.test(row.getAttribute('data-search') || '');
      if (id === 'apple') return cat.indexOf('apple') !== -1 || cat.indexOf('gift') !== -1;
      return cat.indexOf(id) !== -1;
    }

    function updateBadges() {
      chips.forEach(function (chip) {
        var id = chip.getAttribute('data-filter');
        var count = rows.filter(function (row) { return matchesCategory(row, id); }).length;
        var badge = chip.querySelector('.badge');
        if (badge) {
          badge.setAttribute('data-count', String(count));
          badge.textContent = String(count);
        }
      });
    }

    function apply() {
      var q = normalize(search.value);
      searchBox.classList.toggle('has-query', q.length > 0);
      var visible = 0;
      rows.forEach(function (row) {
        var okCat = matchesCategory(row, filter);
        var hay = normalize(row.getAttribute('data-search') + ' ' + row.textContent);
        var okQuery = !q || hay.indexOf(q) !== -1;
        var show = okCat && okQuery;
        row.classList.toggle('is-hidden', !show);
        if (show) visible += 1;
      });
      var hasRows = rows.length > 0;
      empty.classList.toggle('show', !hasRows);
      noResults.classList.toggle('show', hasRows && visible === 0);
    }

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        filter = chip.getAttribute('data-filter') || 'all';
        chips.forEach(function (c) {
          var on = c === chip;
          c.classList.toggle('selected', on);
          c.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        apply();
      });
    });

    search.addEventListener('input', apply);
    clearBtn.addEventListener('click', function () {
      search.value = '';
      apply();
      search.focus();
    });

    var startX = 0, startY = 0, tracking = false;
    var list = document.getElementById('list');
    list.addEventListener('touchstart', function (e) {
      if (!e.touches[0]) return;
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    list.addEventListener('touchend', function (e) {
      if (!tracking || !e.changedTouches[0]) return;
      tracking = false;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      var ids = chips.map(function (c) { return c.getAttribute('data-filter'); });
      var i = ids.indexOf(filter);
      var next = dx < 0 ? i + 1 : i - 1;
      if (next < 0 || next >= chips.length) return;
      chips[next].click();
    }, { passive: true });

    updateBadges();
    apply();
  })();
  </script>
</body>
</html>
