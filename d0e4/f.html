<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Франшиза zStore</title>
<style>
  :root {
    --bg: #f4f5f7;
    --ink: #111318;
    --muted: #6e7380;
    --accent: #0088fe;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 28px calc(48px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: rgba(0, 136, 254, 0.12);
    border-radius: 999px;
    padding: 6px 12px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 700;
  }
  p {
    margin: 0;
    font-size: 16px;
    line-height: 1.45;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">Франшиза</div>
      <h1>Скоро появится</h1>
      <p>Раздел временно пуст. Скоро здесь будет партнёрская программа zStore.</p>
    </div>
  </div>
</body>
</html>
