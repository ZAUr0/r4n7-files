<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Установка</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #111318;
    --muted: #6e7380;
    --date: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --ink: #f2f2f7;
      --muted: #aeaeb2;
      --date: #8e8e93;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    -webkit-text-size-adjust: auto;
  }
  article {
    width: 100%;
    padding: 52px 20px calc(96px + env(safe-area-inset-bottom));
  }
  .date { margin: 0 0 8px; color: var(--date); font-size: 15px; }
  h1 {
    margin: 0 0 18px;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.5px;
    font-weight: 700;
  }
  .hero {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
    object-position: center;
    border-radius: 24px;
    margin: 0 0 22px;
    background: #dfe6f3;
  }
  p {
    margin: 0 0 14px;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
  }
  .date { color: var(--date); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (prefers-color-scheme: dark) {
    .hero { background: #2c2c2e; }
  }
  @media (min-width: 768px) {
    article { padding-left: 40px; padding-right: 40px; }
    h1 { font-size: 36px; }
    .hero { height: 240px; }
    p { font-size: 18px; }
  }
</style>
</head>
<body>
  <article>
    <img class="hero" src="../covers/07.png" alt="Установка" width="1170" height="450" decoding="async">
    <p class="date">14 сентября</p>
    <h1>Установка</h1>
    <p>Схема установки не менялась. Новость нужна, чтобы коротко сказать об этом людям, которые ждут правки в разделе новостей.</p>
    <p>Прогресс установки по-прежнему виден в библиотеке, а не на этой странице.</p>
    <p>Страница статичная: никаких кнопок установки здесь нет, только текст.</p>
  </article>
</body>
</html>
