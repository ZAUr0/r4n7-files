<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Добро пожаловать в zStore</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #111318;
    --muted: #8e8e93;
    --date: #8e8e93;
    --chev: #c7c7cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --ink: #f2f2f7;
      --muted: #aeaeb2;
      --date: #8e8e93;
      --chev: #636366;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    -webkit-text-size-adjust: auto;
  }
  article {
    width: 100%;
    padding: 52px 20px calc(96px + env(safe-area-inset-bottom));
  }
  /* Точная копия карточки с главного экрана новостей */
  .card {
    display: block;
    width: 100%;
    margin: 0 0 16px;
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
  }
  .hero-pad {
    padding: 12px 12px 0;
  }
  .hero {
    display: block;
    width: 100%;
    height: 132px;
    object-fit: cover;
    object-position: center;
    border-radius: 16px;
    background: #dfe6f3;
  }
  .body {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 18px;
  }
  .copy { min-width: 0; flex: 1; }
  .copy strong {
    display: block;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.35px;
    color: var(--ink);
  }
  .copy .date {
    display: block;
    margin-top: 3px;
    font-size: 14px;
    line-height: 1.25;
    color: var(--date);
    font-weight: 400;
  }
  .copy p {
    margin: 6px 0 0;
    font-size: 15px;
    line-height: 1.35;
    color: var(--muted);
    font-weight: 400;
  }
  .chev {
    flex: none;
    color: var(--chev);
    font-size: 22px;
    font-weight: 500;
    line-height: 1;
    padding-right: 2px;
    align-self: center;
  }
  @media (prefers-color-scheme: dark) {
    .hero { background: #2c2c2e; }
  }
  @media (min-width: 768px) {
    article { padding-left: 40px; padding-right: 40px; }
    .copy strong { font-size: 22px; }
    .copy p { font-size: 16px; }
    .hero { height: 160px; }
    .hero-pad { padding: 14px 14px 0; }
  }
</style>
</head>
<body>
  <article>
    <div class="card">
      <div class="hero-pad">
        <img class="hero" src="../covers/01.png" alt="Добро пожаловать в zStore" width="1170" height="450" decoding="async">
      </div>
      <div class="body">
        <div class="copy">
          <strong>Добро пожаловать в zStore</strong>
          <span class="date">Сегодня</span>
          <p>Находите нужные приложения и подписки в одном месте — быстро, удобно и без лишних действий. zStore объединяет всё необходимое для вашего iPhone в простом и современном интерфейсе.</p>
        </div>
        <div class="chev">›</div>
      </div>
    </div>
  </article>
</body>
</html>
