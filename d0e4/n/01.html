<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Добро пожаловать в zStore</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #111318;
    --muted: #6e7380;
    --date: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --ink: #f2f2f7;
      --muted: #aeaeb2;
      --date: #8e8e93;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    -webkit-text-size-adjust: auto;
  }
  article {
    width: 100%;
    padding: 52px 20px calc(96px + env(safe-area-inset-bottom));
  }
  .sheet {
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
  }
  .hero-pad {
    padding: 12px 12px 0;
  }
  .hero {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
    object-position: center;
    border-radius: 16px;
    background: #dfe6f3;
  }
  .content {
    padding: 16px 16px 20px;
  }
  .date { margin: 0 0 8px; color: var(--date); font-size: 15px; }
  h1 {
    margin: 0 0 14px;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.45px;
    font-weight: 700;
  }
  .content p {
    margin: 0 0 12px;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
  }
  .content p:last-child { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (prefers-color-scheme: dark) {
    .hero { background: #2c2c2e; }
  }
  @media (min-width: 768px) {
    article { padding-left: 40px; padding-right: 40px; }
    h1 { font-size: 32px; }
    .hero { height: 240px; }
    .hero-pad { padding: 14px 14px 0; }
    .content p { font-size: 18px; }
  }
</style>
</head>
<body>
  <article>
    <div class="sheet">
      <div class="hero-pad">
        <img class="hero" src="../covers/01.png" alt="Добро пожаловать в zStore" width="1170" height="450" decoding="async">
      </div>
      <div class="content">
        <p class="date">Сегодня</p>
        <h1>Добро пожаловать в zStore</h1>
        <p>Находите нужные приложения и подписки в одном месте — быстро, удобно и без лишних действий.</p>
        <p>zStore объединяет всё необходимое для вашего iPhone в простом и современном интерфейсе.</p>
      </div>
    </div>
  </article>
</body>
</html>
