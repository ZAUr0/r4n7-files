name: Build lite catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - repo.json
      - "icons/*"
      - scripts/build_lite.py

permissions:
  contents: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build lite catalog
        run: |
          pip install --quiet pillow
          python3 scripts/build_lite.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: облегчённый каталог, иконки и детали"
          file_pattern: repo-lite.json icons/s details
