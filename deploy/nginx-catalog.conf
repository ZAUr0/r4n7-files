# Static catalog media for zStore (CDN / VDS).
# Example: cdn.zstoreplus.ru → /var/www/zstore-catalog
#
# TLS: certbot or Cloudflare proxy in front.

server {
    listen 443 ssl http2;
    server_name cdn.zstoreplus.ru;

    root /var/www/zstore-catalog;
    index index.html;

    # Long cache for hashed / versioned filenames
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    gzip on;
    gzip_types image/jpeg image/png text/plain application/json;
    gzip_min_length 256;
}
